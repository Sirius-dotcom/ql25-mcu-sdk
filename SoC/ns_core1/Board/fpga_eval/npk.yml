## Package Base Information
name: bsp-nsdk_ns_core1_fpga_eval
owner: nuclei
description: Nuclei FPGA Evaluation Board Support Package
type: bsp
keywords:
  - board
  - risc-v
  - nuclei
license: Apache-2.0
homepage: https://nucleisys.com/developboard.php

packinfo:
  vendor: ns
  name: Nuclei FPGA Evaluation Board
  doc:
    website: https://nucleisys.com/developboard.php # Website
    sch: https://nucleisys.com/developboard.php # Circuit diagram
    usermanual: https://nucleisys.com/upload/files/fpga/doc/Nuclei_FPGA_DebugKit_Intro_20210421.pdf # User Manual
    extra:
      - uri: https://nucleisys.com/download.php#tools
        description: Nuclei Development Tools # description
      - uri: https://www.rvmcu.com/video.html
        description: Video Introduction For Nuclei RISC-V Processors

## Package Dependency
dependencies:
  - name: ssp-nsdk_ns_core1
    version:

## Package Configurations
configuration:
  download_mode:
    default_value: flashxip0
    type: choice
    global: true
    description: Download/Run Mode
    choices:
      - name: flashxip0
        description: flashxip0 download mode 
      - name: flash0
        description: flash0 download mode 
      - name: ilm
        description: ilm download mode 

## Source Code Management
codemanage:
  installdir: fpga_eval
  copyfiles:
    - path: ["Source/", "Include/", "openocd_ns_core1.cfg"]
  incdirs:
    - path: ["Include/"]

## Set Configuration for other packages
setconfig:
  - config: nmsislibarch
    value: ${nuclei_core.arch}$(join(${nuclei_archext},''))

## Debug Configuration for this board
debugconfig:
  - type: openocd
    description: Nuclei OpenOCD
    configs:
      - key: config
        value: "openocd_ns_core1.cfg"
  - type: jlink
    description: Segger Jlink
    configs:
       - key: device_name
         value: # if leave empty, it will try riscv_arch conversion, otherwise it will directly using this value
       - key: riscv_arch
         value: ${nuclei_core.arch} # arch to device name conversion happened in IDE, eg. rv32imac -> N305
       - key: interface
         value: jtag # jtag or cjtag
       - key: speed
         value: auto  # auto, adaptive, fixed value(KHz) such as 1000

buildconfig:
  - type: gcc
    linkscript:
      - script: "Source/GCC/gcc_ns_core1_${download_mode}.ld"
    common_flags:
      - flags:
    common_defines:
      - defines: DOWNLOAD_MODE=DOWNLOAD_MODE_$(upper(${download_mode}))
      - defines: DOWNLOAD_MODE_STRING=\"$(upper(${download_mode}))\"
      - defines: VECTOR_TABLE_REMAPPED
        condition: $( ${download_mode} == "flash" )
